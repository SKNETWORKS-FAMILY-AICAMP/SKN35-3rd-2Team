# Alembic (DB schema migration) settings.
# NOTE: keep this file ASCII-only. alembic reads it with the OS default encoding
# (cp949 on Korean Windows), so non-ASCII comments break it.
#
# Run from the project root:
#   alembic -c src/db/alembic.ini upgrade head     # bring DB to the latest schema
#   alembic -c src/db/alembic.ini current          # show which revision the DB is at
#   alembic -c src/db/alembic.ini stamp 0001       # for a DB created by init_db(): record "0001 applied" only
# The DB URL comes from .env (DB_*) or DATABASE_URL, same rule as engine.py.

[alembic]
script_location = %(here)s/migrations
# lets env.py import the src package when run from the project root
prepend_sys_path = .
path_separator = os
